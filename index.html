<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад — БЦ-25</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #161922;
            --border: #232733;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-subtle: rgba(59, 130, 246, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
        }

        /* Екран введення пароля */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .auth-box h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .auth-box p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .auth-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            text-align: center;
        }

        .auth-input:focus {
            border-color: var(--accent);
        }

        .auth-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .auth-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .status-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            text-align: right;
        }

        .clock {
            font-family: monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
        }

        .current-week {
            color: #f59e0b;
            font-weight: 500;
            margin-top: 2px;
        }

        .week-toggle {
            display: flex;
            gap: 6px;
            background: var(--surface);
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 24px;
            width: fit-content;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: white;
        }

        /* Авто-стрічка днів Пн-Пт */
        .auto-strip-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
        }

        .auto-strip-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .auto-strip-badge {
            color: var(--accent);
            background: var(--accent-subtle);
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
        }

        .auto-strip-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .auto-strip-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .days-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            padding-bottom: 2px;
        }

        .day-pill {
            flex: 1 0 auto;
            min-width: 110px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .day-pill:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .day-pill.active {
            border-color: var(--accent);
            background: var(--accent-subtle);
            color: var(--text-main);
        }

        .day-pill-tag {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 4px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .day-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: border-color 0.2s;
            scroll-margin-top: 20px;
        }

        .day-card.today {
            border-color: var(--accent);
        }

        .day-header {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .today-badge {
            font-size: 11px;
            background: var(--accent-subtle);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .lessons-list {
            list-style: none;
        }

        .lesson-item {
            display: grid;
            grid-template-columns: 50px 110px 1fr auto;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            font-size: 13px;
        }

        .lesson-item:last-child {
            border-bottom: none;
        }

        .lesson-num {
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
        }

        .lesson-time {
            color: var(--text-muted);
            font-size: 12px;
            font-family: monospace;
        }

        .lesson-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lesson-title {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s;
            width: fit-content;
        }

        .lesson-title:hover {
            color: var(--accent);
        }

        .lesson-teacher {
            color: var(--text-muted);
            font-size: 12px;
        }

        .subgroup {
            font-size: 11px;
            color: #f59e0b;
            font-weight: 600;
            margin-right: 4px;
        }

        .lunch-item {
            grid-column: 1 / -1;
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.01);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .badge-week {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 2px;
        }
        .badge-chis { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .badge-znam { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        .week-block {
            margin-bottom: 6px;
        }
        .week-block:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 650px) {
            .lesson-item {
                grid-template-columns: 40px 1fr;
                grid-template-rows: auto auto;
                gap: 4px 12px;
            }
            .lesson-time {
                grid-column: 2;
            }
            .lesson-content {
                grid-column: 1 / -1;
                margin-top: 4px;
            }
            .lesson-teacher {
                grid-column: 2;
            }
        }
    </style>
</head>
<body>

<!-- Екран авторизації (введення пароля) -->
<div id="auth-screen">

<script>
    // Зашифрований хеш (SHA-256) від пароля "1234"
    const CORRECT_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

    // ВИКОРИСТОВУЄМО localStorage замість sessionStorage, щоб пароль зберігався назавжди
    if (localStorage.getItem('isAuthorized') === 'true') {
        document.getElementById('auth-screen').style.display = 'none';
    }

    // Функція для шифрування введеного тексту у SHA-256
    async function hashString(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkPassword() {
        const inputVal = document.getElementById('password-input').value;
        const inputHash = await hashString(inputVal);
        const errorDiv = document.getElementById('auth-error');

        if (inputHash === CORRECT_HASH) {
            localStorage.setItem('isAuthorized', 'true');
            document.getElementById('auth-screen').style.display = 'none';
            syncAutoDayStrip(true);
        } else {
            errorDiv.style.display = 'block';
            document.getElementById('password-input').value = '';
        }
    }

    // Дозволити натискання Enter для входу
    document.getElementById('password-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {

        }
    });

                    { name: "I п/гр", title: "Кризовий менеджмент", teacher: "Шерстюк К.І.", link: "https://meet.google.com/owp-nmca-gbg" },
                    { name: "II п/гр", title: "Конфліктологія та медіація", teacher: "Корнієць А.О.", link: "https://meet.google.com/zyp-jzny-yuj?hs=179&authuser=0" }
                ]},

                      { name: "II п/гр", title: "Конфліктологія та медіація", teacher: "Корнієць А.О.", link: "https://meet.google.com/zyp-jzny-yuj?hs=179&authuser=0" }

    const shortDayNames = { 1: "Пн", 2: "Вт", 3: "Ср", 4: "Чт", 5: "Пт" };
    let currentMode = 'auto';
    let autoFollowDay = true;
    let activeStripDayId = null;
    let lastObservedDayId = null;

    function getAutoWorkdayId(now = new Date()) {
        const d = now.getDay();
        if (d >= 1 && d <= 5) return d;
        return 1; // у вихідні (сб/нд) показує понеділок
    }

    function renderDaysStrip(now = new Date()) {
        const todayRealDay = now.getDay();
        const targetDayId = activeStripDayId || getAutoWorkdayId(now);
        const stripEl = document.getElementById('days-strip');

        stripEl.innerHTML = scheduleData.map(day => {
            const isSelected = day.dayId === targetDayId;
            const isRealToday = day.dayId === todayRealDay;
            return `<button type="button" class="day-pill ${isSelected ? 'active' : ''}" data-day-id="${day.dayId}" onclick="focusDayFromStrip(${day.dayId})">
                <span>${shortDayNames[day.dayId]} · ${day.dayName}</span>
                ${isRealToday ? '<span class="day-pill-tag">Сьогодні</span>' : ''}
            </button>`;
        }).join('');
    }

    function scrollStripToDay(dayId) {
        const stripEl = document.getElementById('days-strip');
        const pill = stripEl ? stripEl.querySelector(`.day-pill[data-day-id="${dayId}"]`) : null;
        if (stripEl && pill) {
            const targetLeft = pill.offsetLeft - (stripEl.clientWidth - pill.clientWidth) / 2;
            stripEl.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
        }
    }

    function scrollPageToDay(dayId) {
        const card = document.getElementById(`day-card-${dayId}`);
        if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function focusDayFromStrip(dayId) {
        activeStripDayId = dayId;
        const dayObj = scheduleData.find(d => d.dayId === dayId);
        document.getElementById('auto-day-label').innerText = dayObj ? `${shortDayNames[dayId]} (${dayObj.dayName})` : shortDayNames[dayId];
        renderDaysStrip();
        scrollStripToDay(dayId);
        scrollPageToDay(dayId);
    }

    function toggleAutoFollow() {
        autoFollowDay = !autoFollowDay;
        const btn = document.getElementById('auto-follow-btn');
        btn.innerText = autoFollowDay ? 'Автопрокрутка: увімк' : 'Автопрокрутка: вимк';
        if (autoFollowDay) {
            activeStripDayId = getAutoWorkdayId();
            syncAutoDayStrip(true);
        }
    }

    function syncAutoDayStrip(forceScroll = false) {
        const now = new Date();
        const autoDayId = getAutoWorkdayId(now);
        if (!activeStripDayId || autoFollowDay) {
            activeStripDayId = autoDayId;
        }
        const dayObj = scheduleData.find(d => d.dayId === activeStripDayId);
        const isWeekend = now.getDay() === 0 || now.getDay() === 6;
        const suffix = (autoFollowDay && isWeekend) ? ' (вихідний → Пн)' : '';
        document.getElementById('auto-day-label').innerText = `${shortDayNames[activeStripDayId]} · ${dayObj ? dayObj.dayName : ''}${suffix}`;
        renderDaysStrip(now);

        if (forceScroll || (autoFollowDay && lastObservedDayId !== autoDayId)) {
            scrollStripToDay(activeStripDayId);
            if (autoFollowDay && localStorage.getItem('isAuthorized') === 'true') {
                scrollPageToDay(activeStripDayId);
            }
        }
        lastObservedDayId = autoDayId;
    }

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        renderSchedule();
    }

    function renderSchedule() {
        const now = new Date();
        const startOfYear = new Date(now.getFullYear(), 8, 1);
        if (now < startOfYear) startOfYear.setFullYear(startOfYear.getFullYear() - 1);
        const diffWeeks = Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24 * 7));
        const isChisAuto = diffWeeks % 2 === 0;

        const todayDay = now.getDay();

        let html = '';
        scheduleData.forEach(day => {
            const isToday = (day.dayId === todayDay);
            html += `<div id="day-card-${day.dayId}" class="day-card ${isToday ? 'today' : ''}">
                <div class="day-header">
                    <span>${day.dayName}</span>
                    ${isToday ? '<span class="today-badge">Сьогодні</span>' : ''}
                </div>
                <ul class="lessons-list">`;

            day.lessons.forEach(l => {
                if (l.isLunch) {
                    html += `<li class="lesson-item"><div class="lunch-item">🥣 ОБІДНЯ ПЕРЕРВА (${l.time})</div></li>`;
                } else if (l.isDoubleWeek) {
                    html += `<li class="lesson-item">
                        <div class="lesson-num">${l.num}</div>
                        <div class="lesson-time">${l.time}</div>
                        <div class="lesson-content">
                            <div class="week-block">
                                <span class="badge-week badge-chis">Чисельник (ч)</span>`;
                    if (l.chis.isSubgroup) {
                        l.chis.groups.forEach(g => {
                            html += `<div style="margin-top:2px;"><span class="subgroup">[${g.name}]</span><a href="${g.link}" class="lesson-title" target="_blank">${g.title}</a></div>`;
                        });
                    } else {
                        html += `<div><a href="${l.chis.link}" class="lesson-title" target="_blank">${l.chis.title}</a></div>`;
                    }
                    html += `</div>
                            <div class="week-block" style="margin-top: 6px;">
                                <span class="badge-week badge-znam">Знаменник (зн)</span>`;
                    if (l.znam.isSubgroup) {
                        l.znam.groups.forEach(g => {
                            html += `<div style="margin-top:2px;"><span class="subgroup">[${g.name}]</span><a href="${g.link}" class="lesson-title" target="_blank">${g.title}</a></div>`;
                        });
                    } else {
                        html += `<div><a href="${l.znam.link}" class="lesson-title" target="_blank">${l.znam.title}</a></div>`;
                    }
                    html += `</div></div>
                        <div class="lesson-teacher">
                            <div class="week-block"><strong>Ч:</strong> ${l.chis.isSubgroup ? l.chis.groups.map(g => g.teacher).join('<br>') : l.chis.teacher}</div>
                            <div class="week-block" style="margin-top: ${l.chis.isSubgroup ? '24px' : '16px'};"><strong>Зн:</strong> ${l.znam.isSubgroup ? l.znam.groups.map(g => g.teacher).join('<br>') : l.znam.teacher}</div>
                        </div>
                    </li>`;
                } else if (l.isSubgroup) {
                    html += `<li class="lesson-item">
                        <div class="lesson-num">${l.num}</div>
                        <div class="lesson-time">${l.time}</div>
                        <div class="lesson-content">`;
                    l.groups.forEach(g => {
                        html += `<div style="margin-bottom:4px;"><span class="subgroup">[${g.name}]</span><a href="${g.link}" class="lesson-title" target="_blank">${g.title}</a></div>`;
                    });
                    html += `</div>
                        <div class="lesson-teacher">${l.groups.map(g => g.teacher).join('<br>')}</div>
                    </li>`;
                } else {
                    html += `<li class="lesson-item">
                        <div class="lesson-num">${l.num}</div>
                        <div class="lesson-time">${l.time}</div>
                        <div class="lesson-content">
                            <a href="${l.link}" class="lesson-title" target="_blank">${l.title}</a>
                        </div>
                        <div class="lesson-teacher">${l.teacher}</div>
                    </li>`;
                }
            });

            html += `</ul></div>`;
        });

        document.getElementById('schedule-container').innerHTML = html;
        const weekText = isChisAuto ? "Тиждень: Чисельник (ч)" : "Тиждень: Знаменник (зн)";
        document.getElementById('current-week').innerText = weekText;
        syncAutoDayStrip(false);
    }

    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').innerText = `${h}:${m}:${s}`;
        syncAutoDayStrip(false);
    }

    setInterval(updateClock, 1000);
    updateClock();
    renderSchedule();
    if (localStorage.getItem('isAuthorized') === 'true') {
        setTimeout(() => scrollStripToDay(getAutoWorkdayId()), 100);
    }
</script>

</body>
</html>
